<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collegamento TikTok – L'Incontro</title>
<meta name="robots" content="noindex">
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#faf7f2;color:#2b2420;margin:0;padding:24px 16px;}
  .box{max-width:560px;margin:40px auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
  h1{font-size:1.3rem;margin-top:0;}
  textarea{width:100%;box-sizing:border-box;height:110px;font-family:monospace;font-size:.85rem;padding:10px;border:1px solid #ccc;border-radius:8px;}
  button{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#2b2420;color:#fff;font-size:1rem;cursor:pointer;}
  .err{color:#a33;}
  small{color:#776;}
</style>
</head>
<body>
<div class="box">
  <h1>Collegamento TikTok</h1>
  <div id="out">Lettura del codice in corso…</div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  if (p.get('error')) {
    out.innerHTML = '<p class="err">Autorizzazione non riuscita: ' +
      (p.get('error_description') || p.get('error')) + '</p>';
  } else if (p.get('code')) {
    out.innerHTML = '<p>Autorizzazione completata. Copia questo codice e incollalo nella finestra di tiktok_auth.py sul computer.</p>' +
      '<textarea id="c" readonly></textarea><button id="b">Copia codice</button>' +
      '<p><small>Il codice scade dopo pochi minuti e si può usare una sola volta.</small></p>';
    document.getElementById('c').value = p.get('code');
    document.getElementById('b').onclick = () => {
      const t = document.getElementById('c'); t.select();
      (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject())
        .catch(() => document.execCommand('copy'));
      document.getElementById('b').textContent = 'Copiato';
    };
  } else {
    out.innerHTML = '<p>Questa pagina serve solo per collegare l\'agente del bar a TikTok.</p>';
  }
</script>
</body>
</html>
